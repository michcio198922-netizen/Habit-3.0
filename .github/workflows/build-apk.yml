name: Zbuduj APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v7

      - name: Ustaw Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

    - name: Zainstaluj Android SDK 37
  run: |
    yes | sdkmanager --licenses >/dev/null || true
    sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Ustaw Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Zbuduj APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Nawyki-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
